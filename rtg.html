ures identified."}, {"k": "tk", "label": "TK – okno płucne", "imgs": ["14637325/d491b41dfe7b7dbf474ab41a4d5e7c.png", "14637333/11e0fbb6f12159f7b4b156a76eabd6.png", "14637356/ced6196d07dbaf5798f7299d15aabd.png", "14637387/531f2b07501e06948f7af62a9b0466.png", "14637403/a2bb6cc5b2e993369e5614dab8b6b1.png", "14637427/db0acfbfec787046c5a75b89878850.png", "14637451/721ea186919b8a1dcd0e974026a371.png", "14637472/42f160bb698b1c546d698e9336a142.png", "14637493/d854d893efebc89fc083d49090a5e5.png", "14637520/764acf544ee4c7ebe3c8677ccd436c.png", "14637540/98ed4a43aabddac188cada434b8375.png", "14637558/c8e7375a4e435c099e8047e830c6f1.png", "14637575/5e6f5d8111a4005697edee511e39dd.png", "14637600/2e605fad4a588b77c92537acd89c8c.png", "14637631/fa1e76f849607b5c9377b12b9cb563.png", "14637656/8a41ccaf749b08d980b4b928381282.png", "14637675/3071eea425a12a8e2f5ce2c72b3bee.png", "14637687/4ba692b3b5f31074277a1b0a6cbb29.png", "14637698/3c864c68cd926f70b235bd076bc4cf.png", "14637733/585782f26e3874f222aa49632721b6.png"], "f": "Bilateral apically directed pigtail intercostal catheters in situ with only small pneumothoraces bilaterally. Small volume subcutaneous emphysema is related to the intercostal catheters.There are multiple thin-walled cysts scattered throughout both lungs involving all lung zones, measuring from a few millimetres to 14mm. No pulmonary nodules identified. Minor dependent changes present, greater on the left. There are also tiny bilateral pleural effusions, slightly greater on the left. The thoracic duct is not overtly dilated.There is a small, well-defined focal collection of air measuring 13mm contiguous with the right posterolateral aspect of the trachea at the thoracic inlet.There are no enlarged hilar, mediastinal or axillary lymph nodes. Heart size is normal and there is no pericardial effusion.On the most inferior image through the upper abdomen, well-defined fluid density is seen around the origin of the SMA consistent with nodal involvement by lymphangioleiomyomatosis.Within segment 8 of the liver, there is a 6 mm hypodensity. No renal lesion identified within the imaged portions of the kidneys. The adrenal and imaged pancreas are also unremarkable on arterial phase imaging. A thin rim of ascites surrounds the liver.Conclusion:\nbilateral pigtail catheters with small residual pneumothoraces\ncystic lung disease with no pulmonary nodules is consistent with lymphangioleiomyomatosis. No renal lesion appreciated although the kidneys have been incompletely imaged\nsmall bilateral pleural effusions may relate to the pneumothoraces\na small volume of free intraperitoneal fluid is of uncertain significance\nfluid density around the origin of the SMA is consistent with nodal involvement by lymphangioleiomyomatosis"}, {"k": "tk", "label": "TK – druga seria (np. okno śródpiersiowe)", "imgs": ["14638019/8f65aebacd0fdfb1f1aeea43ef21e9.png", "14638055/73f5663f60898dad5e97936b5b4b2d.png", "14638117/a8dc1647892bc043a12105c9b3e307.png", "14638162/a15d5d991bd3df095fe358cb30d1ed.png", "14638208/f38d33716b9b3bd28ec234df077e96.png", "14638255/6a67c1162a35529c9ab9401827ecbe.png", "14638310/10ac8de0a2589e696c391fe96a3b8d.png", "14638346/7f5868a7546687613a5b1fb1f81bdc.png", "14638395/bbc2a8a4ce23daeb60252523757320.png", "14638446/6cd81ef4cb84ca6957236aac54b706.png"], "f": ""}]}, {"slug": "cavitary-pulmonary-tuberculosis", "en": "Cavitary pulmonary tuberculosis", "dx": "Gruźlica płuc z jamą", "key": "RTG: okrągłe przejaśnienie (jama) w prawym polu górnym z liniowymi zacienieniami; typowa lokalizacja: segment szczytowy i tylny płata górnego.", "dd": "rak z jamą, ropień, GPA, aspergilloma", "nxt": "plwocina: Xpert, posiew ×3, preparat; izolacja; HRZE; wywiad kontaktu, HIV, cukrzyca.", "stacks": [{"k": "rtg", "label": "RTG klatki piersiowej", "imgs": ["2051984/410a0505b04d2a5c839358e61a544af4e959d65e09bd5aba7018094519377867.jpeg"], "f": "Right upper lung zone rounded lucency and linear opacities."}]}, {"slug": "non-specific-interstitial-pneumonia-11", const BASE="https://prod-images-static.radiopaedia.org/images/";
const CHECK=["Dane techniczne: projekcja (PA/AP/bok), jakość, rotacja, wdech, penetracja","Aparatura i ciała obce: elektrody, cewniki, dreny, rurka, rozrusznik – i ich położenie","Tkanki miękkie i kości: żebra, obojczyki, łopatki, kręgosłup, rozedma podskórna, stan po mastektomii","Opłucna i kąty przeponowo-żebrowe: płyn, odma, pogrubienie, zwapnienia","Płuca: najpierw pola górne, potem środkowe i dolne; porównaj strony; guzki, zagęszczenia, jamy, rysunek śródmiąższowy, objętość","Wnęki: wielkość, położenie, kształt, gęstość","Śródpiersie i tchawica: przesunięcie, poszerzenie, odma śródpiersiowa","Serce i aorta: sylwetka (w AP nie oceniaj wielkości), kontury","Przepona i obszary przeglądowe: za sercem, za przeponą, szczyty, wnęki, za żebrami","Wniosek: rozpoznanie robocze, różnicowanie, dalsze postępowanie"];
let cur=0,filter='all';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hasTK=c=>c.stacks.some(s=>s.k==='tk');
function stackHtml(s,i){
  const many=s.imgs.length>1;
  return `<div class="viewer" data-i="${i}"><div class="stage"><img alt="${esc(s.label)}" loading="lazy" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="><div class="err">Obraz się nie wczytał.<br>Otwórz plik w przeglądarce (Chrome) z dysku i sprawdź połączenie z internetem.<br><a target="_blank" rel="noopener">otwórz obraz bezpośrednio</a></div><span class="lab">${esc(s.label)}</span><span class="num"></span><button class="zoom" title="Powiększ">⤢</button></div>${many?`<div class="ctl"><button class="pv">‹</button><input type="range" min="0" max="${s.imgs.length-1}" value="${Math.floor(s.imgs.length/2)}"><button class="nx">›</button></div>`:''}</div>`;
}
const urls=s=>s.imgs.map(p=>BASE+p);
function initViewer(v,stacks){
  const s=stacks[+v.dataset.i],U=urls(s),img=v.querySelector('img'),rng=v.querySelector('input'),num=v.querySelector('.num'),err=v.querySelector('.err');
  let idx=rng?+rng.value:0;
  const show=()=>{err.style.display='none';img.src=U[idx];num.textContent=(idx+1)+' / '+U.length;if(rng)rng.value=idx;
    [idx+1,idx-1,idx+2].forEach(j=>{if(U[j]){const t=new Image();t.src=U[j]}})};
  img.onerror=()=>{err.style.display='grid';err.querySelector('a').href=U[idx]};
  const set=n=>{idx=Math.max(0,Math.min(U.length-1,n));show()};
  if(rng){rng.oninput=()=>set(+rng.value);v.querySelector('.pv').onclick=()=>set(idx-1);v.querySelector('.nx').onclick=()=>set(idx+1);
    v.querySelector('.stage').addEventListener('wheel',e=>{e.preventDefault();set(idx+(e.deltaY>0?1:-1))},{passive:false});}
  v.querySelector('.zoom').onclick=()=>openLB(U,idx,n=>{set(n)});
  img.onclick=()=>openLB(U,idx,n=>{set(n)});
  v._show=show;show();
}
let lbU=[],lbI=0,lbCb=null;
const lb=document.getElementById('lb'),lbimg=document.getElementById('lbimg'),lbr=document.getElementById('lbr'),lbn=document.getElementById('lbn');
function lbShow(){lbimg.src=lbU[lbI];lbn.textContent=(lbI+1)+' / '+lbU.length;lbr.max=lbU.length-1;lbr.value=lbI;lbr.style.display=lbU.length>1?'':'none';if(lbCb)lbCb(lbI)}
function openLB(U,i,cb){lbU=U;lbI=i;lbCb=cb;lb.classList.add('on');lbShow()}
lbr.oninput=()=>{lbI=+lbr.value;lbShow()};
lbimg.addEventListener('wheel',e=>{e.preventDefault();lbI=Math.max(0,Math.min(lbU.length-1,lbI+(e.deltaY>0?1:-1)));lbShow()},{passive:false});
document.getElementById('lbx').onclick=()=>lb.classList.remove('on');
lb.onclick=e=>{if(e.target===lb)lb.classList.remove('on')};
document.addEventListener('keydown',e=>{
  if(lb.classList.contains('on')){if(e.key==='Escape')lb.classList.remove('on');if(e.key==='ArrowRight'){lbI=Math.min(lbU.length-1,lbI+1);lbShow()}if(e.key==='ArrowLeft'){lbI=Math.max(0,lbI-1);lbShow()}return}
  if(e.target.tagName==='INPUT'||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='n')go(next(1));if(e.key==='p')go(next(-1));
  if(e.key==='r'){const a=document.querySelector('details.ans');if(a)a.open=!a.open}
});
function visible(i){const c=DATA[i];return filter==='all'||(filter==='tk'&&hasTK(c))}
function next(d){let i=cur;for(let k=0;k<DATA.length;k++){i=(i+d+DATA.length)%DATA.length;if(visible(i))return i}return cur}
function render(){
  const c=DATA[cur],m=document.getElementById('main');
  const rtg=c.stacks.map((s,i)=>[s,i]).filter(x=>x[0].k==='rtg'),tk=c.stacks.map((s,i)=>[s,i]).filter(x=>x[0].k==='tk');
  let h=`<div class="top"><h2>Przypadek ${cur+1}<span> / ${DATA.length}</span></h2><div class="tags"><span class="tag rtg">RTG</span>${tk.length?'<span class="tag tk">TK</span>':''}</div></div>`;
  h+=`<details class="chk"><summary>Schemat opisu RTG klatki piersiowej</summary><div class="in" style="padding:0 18px 14px"><ol>${CHECK.map(x=>'<li>'+esc(x)+'</li>').join('')}</ol></div></details>`;
  h+=`<div class="card"><h3><b>1</b> RTG klatki piersiowej: opisz badanie</h3><div class="views">${rtg.map(x=>stackHtml(x[0],x[1])).join('')}</div></div>`;
  if(tk.length)h+=`<details class="tk" id="tkbox"><summary>TK klatki piersiowej <span class="tag tk">rozwiń po opisaniu RTG</span></summary><div class="in"><div class="views">${tk.map(x=>stackHtml(x[0],x[1])).join('')}</div></div></details>`;
  else h+=`<div class="card"><span class="tag">Do tego przypadku jest tylko RTG</span></div>`;
  h+=`<details class="ans"><summary>Odsłoń rozpoznanie i opis (po odpowiedzi)</summary><div class="in"><div class="dx">${esc(c.dx)}</div>
   <div class="blk"><h4>Co powinno paść w opisie</h4><p>${esc(c.key)}</p></div>
   <div class="blk"><h4>Różnicowanie</h4><p>${esc(c.dd)}</p></div>
   <div class="blk"><h4>Dalsze postępowanie</h4><p>${esc(c.nxt)}</p></div>
   <div class="blk"><h4>Opis Radiopaedia (EN)</h4>${c.stacks.filter(s=>s.f&&s.f.trim()).map(s=>`<div class="en">${esc(s.label)}</div><pre>${esc(s.f)}</pre>`).join('')}</div>
   <div class="blk"><h4>Źródło</h4><p><a href="https://radiopaedia.org/cases/${esc(c.slug)}" target="_blank" rel="noopener">radiopaedia.org/cases/${esc(c.slug)}</a> · Radiopaedia.org, CC BY-NC-SA</p></div></div></details>`;
  h+=`<div class="actions"><button class="btn" id="pv">← Poprzedni</button><button class="btn prim" id="nx">Następny →</button></div>`;
  m.innerHTML=h;
  const all=c.stacks;
  m.querySelectorAll('#main .card .viewer').forEach(v=>initViewer(v,all));
  const tb=document.getElementById('tkbox');
  if(tb){let ready=false;tb.addEventListener('toggle',()=>{if(tb.open&&!ready){ready=true;tb.querySelectorAll('.viewer').forEach(v=>initViewer(v,all))}})}
  document.getElementById('pv').onclick=()=>go(next(-1));document.getElementById('nx').onclick=()=>go(next(1));
  drawGrid();window.scrollTo({top:0});
}
function drawGrid(){
  const g=document.getElementById('grid');g.innerHTML='';
  DATA.forEach((c,i)=>{const b=document.createElement('button');b.textContent=i+1;b.className=(i===cur?'cur ':'')+(visible(i)||i===cur?'':'hide');b.onclick=()=>go(i);g.appendChild(b)});
}
function go(i){cur=i;try{history.replaceState(null,'','#'+(cur+1))}catch(e){}render()}
document.getElementById('filters').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;filter=b.dataset.f;document.querySelectorAll('#filters .chip').forEach(x=>x.classList.toggle('on',x===b));drawGrid()};
const h0=parseInt((location.hash||'').slice(1));if(h0>=1&&h0<=DATA.length)cur=h0-1;
render();
</script><script src="assets/chrome.js"></script></body></html>
