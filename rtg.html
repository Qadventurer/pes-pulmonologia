<!doctype html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="RTG i TK klatki piersiowej: dostęp chroniony hasłem."><title>RTG i TK klatki piersiowej: dostęp chroniony</title>
<link rel="stylesheet" href="assets/rtg.css"><link rel="stylesheet" href="assets/chrome.css"></head><body>
<div id="gate"><form class="box" id="f" autocomplete="off">
<h1>RTG i TK klatki piersiowej</h1>
<p>50 przypadków. Dostęp chroniony hasłem.</p>
<label for="pw">Hasło</label>
<input id="pw" type="password" autocomplete="current-password" required autofocus>
<button class="btn prim" id="go" type="submit">Odblokuj</button>
<p id="err" role="alert"></p>
</form></div>
<div id="app" hidden></div>
<script src="data/rtg.enc.js"></script>
<script>
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(pw){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',enc.encode(pw.normalize('NFC')),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(RTG_ENC.salt),iterations:RTG_ENC.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(RTG_ENC.iv),additionalData:enc.encode('pes-rtg-v1')},key,b64(RTG_ENC.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();const pw=document.getElementById('pw').value;if(!pw)return;
  const go=document.getElementById('go'),err=document.getElementById('err');
  go.disabled=true;err.textContent='Sprawdzam…';
  let data;
  try{data=await decrypt(pw)}catch(x){err.textContent='Nieprawidłowe hasło.';go.disabled=false;return}
  document.getElementById('pw').value='';
  document.getElementById('gate').remove();
  const app=document.getElementById('app');app.innerHTML=data.h;app.hidden=false;
  const sc=document.createElement('script');sc.textContent=data.j;document.body.appendChild(sc);
});
</script>
<script src="assets/chrome.js"></script></body></html>
